        font-size: 16px;

      textarea::placeholder {
        color: #9ba4b5;
      }
      .highlight-pending {

        box-shadow: 0 0 10px rgba(220, 53, 69, 0.4) !important;

      .print-btn {

      }
      textarea:focus {
        border-color: #dc3545 !important;
        box-shadow: 0 0 5px rgba(220, 53, 69, 0.25) !important;
      }
      .scroll-top-btn {
        cursor: pointer;
      }
      .absorber-table {
        width: 100%;
        margin-bottom: 15px;
        border-collapse: collapse;
        font-size: 14px;
      }
      .absorber-table th,
      .absorber-table td {
        border: 1px solid #dee2e6;
        padding: 8px;
        text-align: center;
      }
      .absorber-table th {
        background-color: #f8f9fa;
        font-weight: bold;
      }
      .absorber-table td.val-col {
        color: #0d6efd;
        font-weight: bold;
      }

      /* 하단 메모 요약 영역 스타일 */
      .memo-summary-area {
        background-color: #fff3cd;
        border: 1px solid #ffe69c;
        border-radius: 8px;
        padding: 15px;
        margin-top: 15px;
        font-size: 13px;
        color: #664d03;
      }
      .memo-item {
        margin-bottom: 8px;
        border-bottom: 1px dashed #ffc107;
        padding-bottom: 8px;
      }
      .memo-item:last-child {
        margin-bottom: 0;
        border-bottom: none;
        padding-bottom: 0;
      }

      /* 커스텀 스크롤바 감추기 (퀵링크 영역) */
      .quick-links::-webkit-scrollbar {
        display: none;
      }
      .quick-links {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }

      .quick-link-btn:hover {
        color: #000 !important;
      }

        text-decoration: none !important; /* 밑줄 완벽 제거 */
      }

      a.phone-text:link,
      a.phone-text:visited,
      a.phone-text:hover,
      a.phone-text:active {
        text-decoration: none !important;
      }

        color: #6c757d;
        background-color: #f8f9fa;
        padding: 10px;

          desc: '냉각수 온도가 과냉방지 설정조건에 도달했을 때 관련 밸브 제어가 정상적으로 이루어지는가?',
          details: '',
          placeholder:
            '이상한 점 : 냉각수 15℃ 이하이나 3-Way 바이패스 밸브 미작동 (과냉각)',
        },
        {
          cat: '▣ 냉각탑',
          title: 'PILOT 실험실 냉각수 온도',
          desc: 'PILOT 실험실의 냉각수 공급·환수온도가 정상 운전범위에서 작동하고 있는가?',
          details: '',
          placeholder:
            '이상한 점 : PILOT 실험실 공급 냉각수 온도가 28℃로 기준치 상회',
        },
        {
          cat: '▣ 냉각탑',
          title: '이상패턴',
          desc: '동일한 운전조건의 냉각탑·펌프·열교환기와 비교했을 때 온도·Hz·밸브 개도·운전상태 등이 확연히 다른 설비가 있는가?',
          details: '',
          placeholder:
            '이상한 점 : 냉각탑 #1만 수위 조절 밸브 헌팅 및 진동 스위치 감지됨',
        },
        {
          cat: '▣ 냉각탑',
          title: '열원설비 현장확인',
          desc: '자동제어 화면에서 이상이 발견되어 냉각탑·순환펌프·열교환기·밸브 등의 현장 확인이 필요한 설비가 있는가?',
          details: '',
          placeholder:
            '이상한 점 : 냉각탑 #3 감속기 오일 누유 의심되어 현장 확인 요망',
        },

        // 4. 흡착탑
        {
          cat: '▣ 흡착탑',
          shift: 'day',
          title: 'E6동 (주간)',
          desc: '자동제어 화면의 수치가 오차범위 내에 있습니까?',
          details: '',
          type: 'absorber',
          data: [
            { label: 'ORG1', val: 106 },
            { label: 'ORG2', val: 106 },
            { label: 'ACID', val: 96 },
          ],
        },
        {
          cat: '▣ 흡착탑',
          shift: 'day',
          title: 'E8동 (주간)',
          desc: '자동제어 화면의 수치가 오차범위 내에 있습니까',
          details: '',
          type: 'absorber',
          data: [
            { label: 'ORG2', val: 108 },
            { label: 'ACID', val: 55 },
          ],
        },
        {
          cat: '▣ 흡착탑',
          shift: 'day',
          title: 'E57 (주간)',
          desc: '자동제어 화면의 수치가 오차범위 내에 있습니까',
          details: '',
          type: 'absorber',
          data: [
            { label: '#1', val: 25 },
            { label: '#2', val: 35 },
            { label: '#3', val: 25 },
            { label: '#4', val: 25 },
          ],
        },

        {
          cat: '▣ 흡착탑',
          shift: 'night',
          title: 'E6동 (야간)',
          desc: '자동제어 화면의 수치가 오차범위 내에 있습니까',
          details: '',
          type: 'absorber',
          data: [
            { label: 'ORG1', val: 85 },
            { label: 'ORG2', val: 85 },
            { label: 'ACID', val: 69 },
          ],
        },
        {
          cat: '▣ 흡착탑',
          shift: 'night',
          title: 'E8동 (야간)',
          desc: '자동제어 화면의 수치가 오차범위 내에 있습니까',
          details: '',
          type: 'absorber',
          data: [
            { label: 'ORG2', val: 87 },
            { label: 'ACID', val: 44 },
          ],
        },
        {
          cat: '▣ 흡착탑',
          shift: 'night',
          title: 'E57 (야간)',
          desc: '자동제어 화면의 수치가 오차범위 내에 있습니까',
          details: '',
          type: 'absorber',
          data: [
            { label: '#1', val: 20 },
            { label: '#2', val: 28 },
            { label: '#3', val: 20 },
            { label: '#4', val: 20 },
          ],
        },
      ]

      let state = JSON.parse(localStorage.getItem('dp3_bas_v20') || '{}')
      let pendingFocusIndex = null

      function save() {
        localStorage.setItem('dp3_bas_v20', JSON.stringify(state))
      }

      function setV(i, v) {
        let currentState = state[i]?.v

        if (currentState === v) {
          state[i] = { ...(state[i] || {}), v: null }
          pendingFocusIndex = null
        } else {
          state[i] = { ...(state[i] || {}), v: v }
          if (v === 'yes') {
            pendingFocusIndex = i
          }
        }

        save()
        render()
      }

      function setN(i, n) {
        state[i] = { ...(state[i] || {}), n }
        save()
        updateMemoSummary()
      }

      function toggleShift(shift) {
        currentShift = shift
        render()
      }

      function render() {
        let el = document.getElementById('list')
        el.innerHTML = ''

        let currentCategory = ''
        let categoryIndex = 0

        items.forEach((x, i) => {
          if (x.shift && x.shift !== currentShift) {
            return
          }

          let s = state[i] || {},
            v = s.v || ''

          if (x.cat !== currentCategory) {
            currentCategory = x.cat
            categoryIndex = 0

            let sectionId = ''
            if (currentCategory === '▣ 스마트 공조기') sectionId = 'cat-dp3'
            else if (currentCategory === '▣ 흡수식 냉동기')
              sectionId = 'cat-chiller'
            else if (currentCategory === '▣ 냉각탑') sectionId = 'cat-tower'
            else if (currentCategory === '▣ 흡착탑') sectionId = 'cat-absorber'

            if (currentCategory === '▣ 흡착탑') {
              el.insertAdjacentHTML(
                'beforeend',
                `
                  <div class="mb-3 bg-white p-3 rounded text-dark text-center shadow-sm" style="border: 2px solid #aecae8;">
                      <label class="fw-bold mb-2 d-block" style="font-size:14px; color:#17324d;">🕒 흡착탑 점검 시간대 선택</label>
                      <div class="btn-group w-100" role="group">
                          <input type="radio" class="btn-check" name="shiftToggle" id="shiftDay" autocomplete="off" onchange="toggleShift('day')" ${currentShift === 'day' ? 'checked' : ''}>
                          <label class="btn btn-outline-primary fw-bold" for="shiftDay" style="font-size:13px;">주간 (06:00~17:30)</label>
                          
                          <input type="radio" class="btn-check" name="shiftToggle" id="shiftNight" autocomplete="off" onchange="toggleShift('night')" ${currentShift === 'night' ? 'checked' : ''}>
                          <label class="btn btn-outline-primary fw-bold" for="shiftNight" style="font-size:13px;">야간 (17:30~06:00)</label>
                      </div>
                  </div>
                `,
              )
            }

            el.insertAdjacentHTML(
              'beforeend',
              `<div id="${sectionId}" class="category-title">${currentCategory}</div>`,
            )
          }

          categoryIndex++

          let titleColorClass =
            x.title.includes('고장경보 알람') ||
            x.title.includes('고장·경보 알람')
              ? 'text-danger'
              : 'text-dark'

          let detailsHtml = x.details
            ? `<div class="item-details mt-2">${x.details}</div>`
            : ''

          let contentHtml = ''

          if (x.type === 'absorber') {
            let tableRows = ''
            x.data.forEach((item) => {
              tableRows += `<tr><td>${item.label}</td><td class="val-col">${item.val} mmH2O</td></tr>`
            })

            contentHtml = `
              <p class="text-secondary mb-3" style="font-size: 13px; line-height: 1.5;">${x.desc}</p>
              ${detailsHtml}
              <table class="absorber-table mt-2">
                  <tbody>
                      ${tableRows}
                  </tbody>
              </table>
              <div class="row g-2 mb-2">
                <div class="col-6">
                  <button class="btn w-100 fw-bold border ${v == 'no' ? 'btn-success' : 'btn-light text-secondary'}" 
                          style="font-size: 13px;" onclick="setV(${i},'no')">🟢 이상 없음</button>
                </div>
                <div class="col-6">
                  <button class="btn w-100 fw-bold border ${v == 'yes' ? 'btn-danger' : 'btn-light text-secondary'}" 
                          style="font-size: 13px;" onclick="setV(${i},'yes')">🔴 이상 있음</button>
                </div>
              </div>
              <textarea id="memo-${i}" class="form-control text-secondary border-light-subtle shadow-none mt-2 ${v === 'yes' ? '' : 'd-none'}" 
                        style="font-size: 16px; background-color: #f8f9fa; resize: vertical;" 
                        rows="2" 
                        placeholder="이상한 점 : " 
                        onchange="setN(${i},this.value)">${s.n || ''}</textarea>
              `
          } else {
            contentHtml = `
              <p class="text-secondary mb-3" style="font-size: 13px; line-height: 1.5;">${x.desc}</p>
              ${detailsHtml}
              <div class="row g-2 mb-2">
                <div class="col-6">
                  <button class="btn w-100 fw-bold border ${v == 'no' ? 'btn-success' : 'btn-light text-secondary'}" 
                          style="font-size: 13px;" onclick="setV(${i},'no')">🟢 이상 없음</button>
                </div>
                <div class="col-6">
                  <button class="btn w-100 fw-bold border ${v == 'yes' ? 'btn-danger' : 'btn-light text-secondary'}" 
                          style="font-size: 13px;" onclick="setV(${i},'yes')">🔴 이상 있음</button>
                </div>
              </div>
              
              <div class="fw-bold mb-2" style="font-size: 12px; color: ${v == 'yes' ? '#c62836' : v == 'no' ? '#137447' : '#69747f'};">
                ${v == 'yes' ? '⚠ 이상 있음 — 현장 확인 필요' : v == 'no' ? '✓ 이상 없음' : '미점검'}
              </div>
              
              <textarea id="memo-${i}" class="form-control text-secondary border-light-subtle shadow-none ${v === 'yes' ? '' : 'd-none'}" 
                        style="font-size: 16px; background-color: #f8f9fa; resize: vertical;" 
                        rows="2" 
                        placeholder="${x.placeholder || '이상한 점 : '}" 
                        onchange="setN(${i},this.value)">${s.n || ''}</textarea>
              `
          }

          el.insertAdjacentHTML(
            'beforeend',
            `
          <section id="item-${i}" class="card border-0 shadow-sm mb-3 rounded-4">
            <div class="card-body p-3">
              <div class="d-flex align-items-center mb-2">
                <span class="badge rounded-circle d-flex align-items-center justify-content-center me-2" 
                      style="width: 28px; height: 28px; background-color: #e8f0ff; color: #2d6cdf; font-size: 14px;">
                  ${categoryIndex}
                </span>
                <h6 class="fw-bold mb-0 ${titleColorClass}" style="font-size: 15px;">${x.title}</h6>
              </div>
              ${contentHtml}
            </div>
          </section>
          `,
          )
        })

        update()
        updateMemoSummary()

        if (pendingFocusIndex !== null) {
          let targetTextarea = document.getElementById(
            'memo-' + pendingFocusIndex,
          )
          if (targetTextarea) {
            targetTextarea.focus()
            let length = targetTextarea.value.length
            targetTextarea.setSelectionRange(length, length)
          }
          pendingFocusIndex = null
        }
      }

      function update() {
        let y = 0,
          n = 0,
          currentTotal = 0

        items.forEach((x, i) => {
          if (x.shift && x.shift !== currentShift) {
            return
          }
          currentTotal++
          if (state[i]?.v == 'yes') y++
          else if (state[i]?.v == 'no') n++
        })

        let done = y + n
        let pending = currentTotal - done

        document.getElementById('yes1').textContent = y
        document.getElementById('no1').textContent = n
        document.getElementById('pending1').textContent = pending

        document.getElementById('yes2').textContent = y
        document.getElementById('no2').textContent = n
        document.getElementById('pending2').textContent = pending

        document.getElementById('progressText').textContent =
          done + ' / ' + currentTotal

        let pct = currentTotal === 0 ? 0 : (done / currentTotal) * 100
        document.getElementById('bar').style.width = pct + '%'

        const printBtns = document.querySelectorAll('.print-btn')
        if (pending > 0) {
          printBtns.forEach((btn) => {
            btn.style.opacity = '0.5'
            btn.style.cursor = 'not-allowed'
          })
        } else {
          printBtns.forEach((btn) => {
            btn.style.opacity = '1'
            btn.style.cursor = 'pointer'
          })
        }
      }

      // 하단 메모 요약 업데이트 함수
      function updateMemoSummary() {
        const summaryArea = document.getElementById('memoSummary')
        const summaryContent = document.getElementById('memoSummaryContent')

        let hasMemo = false
        let summaryHtml = ''

        items.forEach((x, i) => {
          if (x.shift && x.shift !== currentShift) return

          let s = state[i] || {}
          if (s.v === 'yes' && s.n && s.n.trim() !== '') {
            hasMemo = true
            summaryHtml += `
                    <div class="memo-item">
                        <b>[${x.cat.replace('▣ ', '')}] ${x.title}</b><br>
                        <span class="text-dark">${esc(s.n)}</span>
                    </div>
                  `
          }
        })

        if (hasMemo) {
          summaryContent.innerHTML = summaryHtml
          summaryArea.classList.remove('d-none')
        } else {
          summaryArea.classList.add('d-none')
          summaryContent.innerHTML = ''
        }
      }

      function allNo() {
        items.forEach((x, i) => {
          if (!x.shift || x.shift === currentShift) {
            state[i] = { ...(state[i] || {}), v: 'no' }
          }
        })
        save()
        render()
      }

      function resetAll() {
        if (confirm('점검 결과와 메모를 모두 초기화할까요?')) {
          state = {}
          save()
          render()
        }
      }

      function esc(s) {
        return s
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
      }

      function printResult() {
        let firstPendingIndex = -1
        for (let i = 0; i < items.length; i++) {
          if (items[i].shift && items[i].shift !== currentShift) continue

          if (!state[i] || (state[i].v !== 'yes' && state[i].v !== 'no')) {
            firstPendingIndex = i
            break
          }
        }

        if (firstPendingIndex !== -1) {
          alert('미점검 항목이 있습니다. 모든 항목을 점검해주세요.')
          const targetElement = document.getElementById(
            'item-' + firstPendingIndex,
          )

          if (targetElement) {
            targetElement.scrollIntoView({
              behavior: 'smooth',
              block: 'center',
            })
            targetElement.classList.add('highlight-pending')
            setTimeout(() => {
              targetElement.classList.remove('highlight-pending')
            }, 2000)
          }
          return
        }

        let d = new Date(),
          hours = d.getHours(),
          timeStr = d.toLocaleString('ko-KR')

        let hasError = false

        items.forEach((x, i) => {
          if (x.shift && x.shift !== currentShift) return
          if (state[i]?.v === 'yes') {
            hasError = true
          }
        })

        let a = []

        if (!hasError) {
          let message =
            hours < 12
              ? '오전 기계설비점검 이상없음'
              : '오후 기계설비점검 이상없음'
          a = [message, '점검일시: ' + timeStr, '']
        } else {
          a = ['기계설비점검 이상 보고', '점검일시: ' + timeStr, '']

          let currentCat = ''

          items.forEach((x, i) => {
            if (x.shift && x.shift !== currentShift) return
            let s = state[i] || {}
            if (s.v === 'yes') {
              if (x.cat !== currentCat) {
                currentCat = x.cat
                a.push('')
                a.push('[' + currentCat + ']')
              }

              a.push('- ' + x.title + ': 이상 있음')
              if (s.n) a.push('  상세설명: ' + s.n)
            }
          })
        }

        let w = open('', '_blank')
        w.document.write(
          "<pre style='white-space:pre-wrap;font:14px sans-serif;padding:24px'>" +
            esc(a.join('\n').trim()) +
            '</pre>',
        )
        w.document.close()
        w.print()
      }

      function scrollToTop() {
        window.scrollTo({
          top: 0,
          behavior: 'smooth',
        })
      }

      render()
    </script>
  </body>
</html>
