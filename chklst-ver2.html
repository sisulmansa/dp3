<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#17324d" />
    <title>기계설비점검 퀘스트</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      /* 화면 밀림 방지를 위한 기본 설정 */
      html,
      body {
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 0;
        background-color: #eef2f5;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
        overflow: hidden !important;
        touch-action: manipulation;
      }

      /* 상단 헤더 및 진행률 */
      .header-bar {
        background-color: #17324d;
        padding: 15px;
        color: white;
        text-align: center;
        position: relative;
        z-index: 10;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .progress-container {
        width: 100%;
        height: 10px;
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 5px;
        margin-top: 10px;
        overflow: hidden;
      }
      #exp-bar {
        height: 100%;
        background-color: #63d3a5;
        width: 0%;
        transition: width 0.3s ease-out;
      }

      /* 콤보 이펙트 */
      #combo-text {
        position: absolute;
        top: 100px;
        right: 20px;
        font-size: 24px;
        font-weight: bold;
        color: #ffc107;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transform: scale(0.5);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 100;
      }
      .show-combo {
        opacity: 1 !important;
        transform: scale(1.2) !important;
      }

      /* 카드 덱 UI */
      .card-container {
        position: relative;
        width: 90%;
        max-width: 400px;
        height: 52vh;
        margin: 15px auto;
        perspective: 1000px;
      }
      .swipe-card {
        position: absolute;
        width: 100%;
        height: 100%;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition:
          transform 0.3s ease,
          opacity 0.3s ease;
        will-change: transform;
        z-index: 2;
        overflow-y: auto;
      }
      .swipe-card::-webkit-scrollbar {
        display: none;
      }
      .card-cat {
        font-size: 14px;
        color: #0d6efd;
        margin-bottom: 10px;
        font-weight: bold;
      }
      .card-title-text {
        font-size: 20px;
        font-weight: 900;
        color: #17324d;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px; /* 번호와 텍스트 사이 간격 */
      }

      /* 동그라미 번호 스타일 */
      .card-index-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        background-color: #e8f0ff;
        color: #2d6cdf;
        font-size: 14px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .card-desc {
        font-size: 14px;
        color: #6c757d;
        line-height: 1.5;
      }
      .card-details {
        margin-top: 15px;
        font-size: 12px;
        background: #f8f9fa;
        padding: 10px;
        border-radius: 8px;
        border-left: 3px solid #6c757d;
        text-align: left;
        width: 100%;
      }

      /* 상태 스탬프 */
      .stamp {
        position: absolute;
        font-size: 36px;
        font-weight: bold;
        opacity: 0;
        z-index: 10;
        text-transform: uppercase;
        pointer-events: none;
      }
      .stamp-like {
        color: #198754;
        border: 4px solid #198754;
        padding: 5px 15px;
        border-radius: 10px;
        top: 40px;
        right: 20px;
        transform: rotate(20deg);
      }
      .stamp-nope {
        color: #dc3545;
        border: 4px solid #dc3545;
        padding: 5px 15px;
        border-radius: 10px;
        top: 40px;
        left: 20px;
        transform: rotate(-20deg);
      }
      .stamp-back {
        color: #6c757d;
        border: 4px solid #6c757d;
        padding: 5px 15px;
        border-radius: 10px;
        top: 40px;
        left: 20px;
        transform: rotate(-20deg);
      }

      /* 하단 액션 버튼 */
      .action-buttons {
        display: flex;
        justify-content: center;
        gap: 50px;
        margin-top: 5px;
      }
      .action-btn {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        border: none;
        font-size: 28px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        transition: transform 0.1s;
      }
      .action-btn:active {
        transform: scale(0.9);
      }
      .btn-like {
        background-color: #fff;
        border: 3px solid #198754;
      }
      .btn-nope {
        background-color: #fff;
        border: 3px solid #dc3545;
      }

      /* 화면 흔들림 효과 */
      @keyframes shake {
        0% {
          transform: translate(1px, 1px) rotate(0deg);
        }
        20% {
          transform: translate(-3px, 0px) rotate(1deg);
        }
        40% {
          transform: translate(1px, -1px) rotate(1deg);
        }
        60% {
          transform: translate(-3px, 1px) rotate(0deg);
        }
        80% {
          transform: translate(-1px, -1px) rotate(1deg);
        }
        100% {
          transform: translate(1px, -2px) rotate(-1deg);
        }
      }
      .shake-screen {
        animation: shake 0.3s;
        border: 3px solid #dc3545;
      }

      /* 결과 화면 */
      #result-screen {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #17324d;
        color: white;
        z-index: 1050;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
      }
      .rank-text {
        font-size: 60px;
        font-weight: 900;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        margin: 10px 0;
      }
      .rank-S {
        color: #ffc107;
      }
      .rank-A {
        color: #63d3a5;
      }
      .rank-B {
        color: #dc3545;
      }

      .absorber-table {
        width: 100%;
        margin-top: 15px;
        border-collapse: collapse;
        font-size: 13px;
      }
      .absorber-table th,
      .absorber-table td {
        border: 1px solid #dee2e6;
        padding: 6px;
        text-align: center;
      }
      .absorber-table th {
        background-color: #f8f9fa;
        font-weight: bold;
      }
      .absorber-table td.val-col {
        color: #0d6efd;
        font-weight: bold;
      }
      .phone-text {
        text-decoration: none !important;
      }
      a.phone-text:link,
      a.phone-text:visited,
      a.phone-text:hover,
      a.phone-text:active {
        text-decoration: none !important;
      }
    </style>
  </head>
  <body>
    <!-- 헤더 (버튼 및 경험치 바) -->
    <header class="header-bar" id="app-header">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1
          class="fw-bold mb-0 text-truncate"
          style="font-size: 15px; flex-shrink: 0"
        >
          🏭 기계설비점검
        </h1>

        <!-- 주야간 선택 토글 영역 -->
        <div
          class="btn-group shadow-sm mx-2"
          role="group"
          style="flex-grow: 1; max-width: 200px"
        >
          <input
            type="radio"
            class="btn-check"
            name="shiftToggle"
            id="shiftDay"
            autocomplete="off"
            checked
            onchange="toggleShift('day')"
          />
          <label
            class="btn btn-outline-light fw-bold py-1 px-0"
            for="shiftDay"
            style="font-size: 11px; border-color: rgba(255, 255, 255, 0.3)"
            >☀️ 주간</label
          >
          <input
            type="radio"
            class="btn-check"
            name="shiftToggle"
            id="shiftNight"
            autocomplete="off"
            onchange="toggleShift('night')"
          />
          <label
            class="btn btn-outline-light fw-bold py-1 px-0"
            for="shiftNight"
            style="font-size: 11px; border-color: rgba(255, 255, 255, 0.3)"
            >🌙 야간</label
          >
        </div>

        <a
          href="/dp3/"
          class="btn btn-light rounded-pill px-2 py-1 text-dark fw-bold shadow-sm"
          style="font-size: 12px; flex-shrink: 0"
        >
          Home
        </a>
      </div>

      <!-- 기능 버튼 영역 -->
      <div class="row g-2 mb-2">
        <div class="col-4">
          <button
            class="btn btn-success w-100 fw-bold shadow-sm"
            style="font-size: 12px; padding: 8px 0"
            onclick="allNo()"
          >
            전체 이상 없음
          </button>
        </div>
        <div class="col-4">
          <button
            class="btn btn-outline-light w-100 fw-bold shadow-sm"
            style="font-size: 12px; padding: 8px 0"
            onclick="resetAll()"
          >
            전체 초기화
          </button>
        </div>
        <div class="col-4">
          <button
            class="btn btn-light w-100 fw-bold text-dark shadow-sm"
            style="font-size: 12px; padding: 8px 0"
            onclick="printResult()"
          >
            PDF 저장/인쇄
          </button>
        </div>
      </div>

      <div class="d-flex justify-content-between small mt-2">
        <span style="font-size: 12px">
          <a href="tel:02-6987-1112" class="phone-text text-white"
            >진행률 - CA 중앙관제기계팀</a
          >
        </span>
        <span id="progress-text">0 / 0</span>
      </div>
      <div class="progress-container">
        <div id="exp-bar"></div>
      </div>
    </header>

    <!-- 콤보 UI -->
    <div id="combo-text">제대로 하는거 맞죠?</div>

    <!-- 카드 영역 -->
    <div class="card-container" id="card-container"></div>

    <!-- 컨트롤 버튼 -->
    <div class="action-buttons" id="control-panel" style="align-items: center">
      <button class="action-btn btn-like" onclick="handleAction('no')">
        🟢
      </button>
      <button class="action-btn btn-nope" onclick="handleAction('yes')">
        🔴
      </button>
    </div>

    <!-- 이상 메모 입력 모달 -->
    <div
      class="modal fade"
      id="memoModal"
      tabindex="-1"
      data-bs-backdrop="static"
    >
      <div class="modal-dialog mx-3" style="margin-top: 5vh">
        <div class="modal-content shadow-lg">
          <div class="modal-header bg-danger text-white py-2">
            <h5 class="modal-title fs-6">⚠️ 이상 항목 발견</h5>
          </div>
          <div class="modal-body">
            <p class="small text-muted fw-bold mb-2" id="modal-target-item"></p>
            <textarea
              id="memo-input"
              class="form-control bg-light"
              rows="3"
              style="font-size: 16px"
              placeholder="이상한 점을 기재해주세요..."
            ></textarea>
          </div>
          <div class="modal-footer d-flex gap-2 py-2">
            <button
              type="button"
              class="btn btn-secondary flex-fill"
              onclick="cancelYes()"
            >
              취소
            </button>
            <button
              type="button"
              class="btn btn-danger flex-fill fw-bold"
              onclick="saveMemo()"
            >
              기록하기
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 완료 결과 화면 -->
    <div id="result-screen">
      <h2>기계설비점검 완료~!</h2>
      <div id="final-rank" class="rank-text rank-S">S</div>
      <p id="result-summary" class="fs-6 mb-3"></p>

      <div
        id="error-summary-list"
        class="w-100 bg-white text-dark rounded-3 p-3 mb-4 text-start shadow-sm"
        style="
          max-height: 35vh;
          overflow-y: auto;
          display: none;
          max-width: 400px;
        "
      >
        <b class="text-danger d-block mb-2" style="font-size: 14px"
          >⚠️ 이상 항목 요약</b
        >
        <div id="error-list-content"></div>
      </div>

      <div class="d-flex flex-column gap-2 mt-2" style="width: 260px">
        <button
          class="btn btn-secondary fw-bold w-100 shadow-sm"
          onclick="returnFromResult()"
        >
          ↩️ 이전 항목으로 (뒤로가기)
        </button>
        <div class="d-flex gap-2 w-100">
          <button
            class="btn btn-light fw-bold flex-fill shadow-sm"
            onclick="printResult()"
          >
            인쇄 / PDF
          </button>
          <button
            class="btn btn-outline-light fw-bold flex-fill shadow-sm"
            onclick="resetAll()"
          >
            다시 점검
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // 1. 화면 확대 방지
      document.addEventListener(
        'touchstart',
        function (event) {
          if (event.touches.length > 1) event.preventDefault()
        },
        { passive: false },
      )
      document.addEventListener(
        'touchmove',
        function (event) {
          if (event.touches.length > 1) event.preventDefault()
        },
        { passive: false },
      )

      // 키보드 닫힘 시 화면 위치 강제 복구 스크립트
      function forceScrollReset() {
        window.scrollTo(0, 0)
        document.body.scrollTop = 0
        document.documentElement.scrollTop = 0
      }
      document.addEventListener('focusout', function (e) {
        if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
          setTimeout(forceScrollReset, 100)
          setTimeout(forceScrollReset, 300)
        }
      })

      // 데이터 정의

            )
            .join('')
          absorberHtml = `<table class="absorber-table"><tbody>${rows}</tbody></table>`
        }

        card.innerHTML = `
          <div class="stamp stamp-like" id="stamp-like">이상없음</div>
          <div class="stamp stamp-nope" id="stamp-nope">이상있음</div>
          <div class="stamp stamp-back" id="stamp-back">이전</div>
          <div class="card-cat">${item.cat}</div>
          <div class="card-title-text">
            <span class="card-index-badge">${index + 1}</span>
            ${item.title}
          </div>
          <div class="card-desc">${item.desc}</div>
          ${detailsHtml}
          ${absorberHtml}
          <div class="mt-4 small text-muted">👈 다음 항목 (이상없음) | 이전 항목 👉</div>
        `

        cardContainer.innerHTML = ''
        cardContainer.appendChild(card)
        updateProgress()
        setupSwipeEvents(card)
      }

      function goBack() {
        if (currentIndex > 0) {
          currentIndex--
          comboCount = 0
          saveState()
          renderCard(currentIndex)
        }
      }

      function returnFromResult() {
        document.getElementById('result-screen').style.display = 'none'
        document.getElementById('app-header').style.display = 'block'
        document.getElementById('card-container').style.display = 'block'
        document.getElementById('control-panel').style.display = 'flex'
        goBack()
      }

      function updateProgress() {
        progressText.innerText = `${currentIndex} / ${items.length}`
        expBar.style.width = `${(currentIndex / items.length) * 100}%`
      }

      function allNo() {
        if (
          !confirm(
            "남은 모든 점검 항목을 '이상 없음'으로 일괄 처리하시겠습니까?",
          )
        )
          return
        while (currentIndex < items.length) {
          let existingMemo =
            (results[currentIndex] && results[currentIndex].memo) || ''
          results[currentIndex] = {
            item: items[currentIndex],
            status: 'no',
            memo: existingMemo,
          }
          currentIndex++
        }
        saveState()
        showResultScreen()
      }

      function resetAll() {
        if (!confirm('모든 점검 결과와 진행 상황을 초기화하시겠습니까?')) return
        results = []
        currentIndex = 0
        localStorage.removeItem(STORAGE_KEY)

        document.getElementById('app-header').style.display = 'block'
        document.getElementById('card-container').style.display = 'block'
        document.getElementById('control-panel').style.display = 'flex'
        document.getElementById('result-screen').style.display = 'none'

        document.getElementById('shiftDay').checked = true
        currentShift = 'day'
        initItems()
        renderCard(currentIndex)
      }

      function printResult() {
        if (currentIndex < items.length) {
          alert('모든 항목의 점검을 완료한 후 인쇄/저장할 수 있습니다.')
          return
        }

        let d = new Date(),
          hours = d.getHours(),
          timeStr = d.toLocaleString('ko-KR')
        let errorItems = results
          .slice(0, items.length)
          .filter((r) => r && r.status === 'yes')
        let a = []

        if (errorItems.length === 0) {
          let successTitle =
            hours < 12
              ? '오전 기계설비점검 이상없음'
              : '오후 기계설비점검 이상없음'
          a = [successTitle, '점검일시: ' + timeStr, '']
        } else {
          let errorTitle =
            hours < 12
              ? '오전 기계설비점검 이상 보고'
              : '오후 기계설비점검 이상 보고'
          a = [errorTitle, '점검일시: ' + timeStr, '']
          let currentCat = ''
          errorItems.forEach((r) => {
            if (r.item.cat !== currentCat) {
              currentCat = r.item.cat
              a.push('')
              a.push('[' + currentCat + ']')
            }
            a.push('- ' + r.item.title + ': 이상 있음')
            if (r.memo) a.push('  상세설명: ' + r.memo)
          })
        }

        let w = open('', '_blank')
        let safeText = a
          .join('\n')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
        w.document.write(
          "<pre style='white-space:pre-wrap; font-family:sans-serif; padding:24px; font-size:14px;'>" +
            safeText +
            '</pre>',
        )
        w.document.close()
        w.print()
      }

      function handleCombo() {
        const now = Date.now()
        if (now - lastActionTime < 3000) {
          comboCount++
          if (comboCount > 1) {
            comboEl.innerText = `제대로 하는거 맞죠?`
            comboEl.classList.add('show-combo')
            setTimeout(() => comboEl.classList.remove('show-combo'), 800)
          }
        } else {
          comboCount = 1
        }
        lastActionTime = now
      }

      function triggerHaptic(type) {
        if (navigator.vibrate) {
          if (type === 'no') navigator.vibrate(10)
          if (type === 'yes') navigator.vibrate([50, 50, 50])
        }
      }

      function handleAction(action) {
        const card = document.getElementById('current-card')
        if (!card) return

        triggerHaptic(action)

        if (action === 'no') {
          card.querySelector('#stamp-like').style.opacity = '1'
          card.style.transform = 'translateX(-150%) rotate(-15deg)'
          handleCombo()

          let existingMemo =
            (results[currentIndex] && results[currentIndex].memo) || ''
          results[currentIndex] = {
            item: items[currentIndex],
            status: 'no',
            memo: existingMemo,
          }
          saveState()

          setTimeout(() => {
            currentIndex++
            saveState()
            renderCard(currentIndex)
          }, 300)
        } else if (action === 'yes') {
          comboCount = 0
          card.querySelector('#stamp-nope').style.opacity = '1'
          card.style.transform = 'translateX(150%) rotate(15deg)'

          document.body.classList.add('shake-screen')
          setTimeout(() => document.body.classList.remove('shake-screen'), 300)

          setTimeout(() => {
            document.getElementById('modal-target-item').innerText =
              `[${items[currentIndex].cat}] ${items[currentIndex].title}`
            let placeholderTxt =
              items[currentIndex].placeholder ||
              '발견된 이상한 점을 기재해주세요...'
            memoInput.setAttribute('placeholder', placeholderTxt)

            let existingMemo =
              (results[currentIndex] && results[currentIndex].memo) || ''
            memoInput.value = existingMemo

            results[currentIndex] = {
              item: items[currentIndex],
              status: 'yes',
              memo: existingMemo,
            }
            saveState()

            memoModal.show()
          }, 300)
        }
      }

      function saveMemo() {
        memoInput.blur()
        setTimeout(() => {
          const memo = memoInput.value
          results[currentIndex] = {
            item: items[currentIndex],
            status: 'yes',
            memo: memo,
          }
          saveState()
          memoModal.hide()
          setTimeout(() => {
            currentIndex++
            saveState()
            renderCard(currentIndex)
          }, 300)
        }, 150)
      }

      function cancelYes() {
        memoInput.blur()
        setTimeout(() => {
          const currentMemo = memoInput.value
          results[currentIndex] = {
            item: items[currentIndex],
            status: null,
            memo: currentMemo,
          }
          saveState()

          memoModal.hide()
          setTimeout(() => {
            const card = document.getElementById('current-card')
            card.style.transition = 'transform 0.3s ease, opacity 0.3s ease'
            card.style.transform = 'translateX(0px) rotate(0deg)'
            card.querySelector('#stamp-like').style.opacity = 0
            card.querySelector('#stamp-nope').style.opacity = 0
          }, 300)
        }, 150)
      }

      function setupSwipeEvents(card) {
        let startX = 0,
          currentX = 0,
          isDragging = false
        const likeStamp = card.querySelector('#stamp-like')
        const backStamp = card.querySelector('#stamp-back')

        card.addEventListener('touchstart', (e) => {
          startX = e.touches[0].clientX
          isDragging = true
          card.style.transition = 'none'
        })

        card.addEventListener('touchmove', (e) => {
          if (!isDragging) return
          currentX = e.touches[0].clientX - startX

          // 첫 카드에서는 이전(오른쪽) 스와이프 차단
          if (currentIndex === 0 && currentX > 0) {
            currentX = 0
          }

          card.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.05}deg)`

          if (currentX < 0) {
            likeStamp.style.opacity = Math.min(Math.abs(currentX) / 100, 1)
            if (backStamp) backStamp.style.opacity = 0
          } else if (currentX > 0) {
            if (backStamp) backStamp.style.opacity = Math.min(currentX / 100, 1)
            likeStamp.style.opacity = 0
          }
        })

        card.addEventListener('touchend', () => {
          isDragging = false
          card.style.transition = 'transform 0.3s ease, opacity 0.3s ease'

          if (currentX < -100) {
            handleAction('no')
          } else if (currentX > 100 && currentIndex > 0) {
            if (backStamp) backStamp.style.opacity = '1'
            card.style.transform = 'translateX(150%) rotate(15deg)'
            setTimeout(() => {
              goBack()
            }, 200)
          } else {
            card.style.transform = 'translateX(0px) rotate(0deg)'
            likeStamp.style.opacity = 0
            if (backStamp) backStamp.style.opacity = 0
          }
          currentX = 0
        })
      }

      function showResultScreen() {
        document.getElementById('app-header').style.display = 'none'
        document.getElementById('card-container').style.display = 'none'
        document.getElementById('control-panel').style.display = 'none'

        const screen = document.getElementById('result-screen')
        const rankEl = document.getElementById('final-rank')
        const summaryEl = document.getElementById('result-summary')
        const errorContainer = document.getElementById('error-summary-list')
        const errorContent = document.getElementById('error-list-content')

        const errorItems = results
          .slice(0, items.length)
          .filter((r) => r && r.status === 'yes')
        const errorCount = errorItems.length

        if (errorCount === 0) {
          rankEl.innerText = 'S'
          rankEl.className = 'rank-text rank-S'
          summaryEl.innerText = '완벽합니다! 발견된 이상 항목이 없습니다.'
          errorContainer.style.display = 'none'
        } else {
          if (errorCount <= 3) {
            rankEl.innerText = 'A'
            rankEl.className = 'rank-text rank-A'
            summaryEl.innerText = `총 ${errorCount}건의 이상 항목을 발견했습니다.`
          } else {
            rankEl.innerText = 'B'
            rankEl.className = 'rank-text rank-B'
            summaryEl.innerText = `총 ${errorCount}건의 이상 항목 발견! 긴급 점검 요망.`
          }

          let htmlStr = ''
          errorItems.forEach((r) => {
            let categoryName = r.item.cat.replace('▣ ', '')
            let memoText = r.memo ? r.memo : '메모 없음'
            htmlStr += `
            <div class="mb-2 pb-2 border-bottom" style="font-size: 13px;">
              <b>[${categoryName}] ${r.item.title}</b><br>
              <span class="text-secondary">${memoText}</span>
            </div>
          `
          })
          errorContent.innerHTML = htmlStr
          errorContainer.style.display = 'block'
        }

        screen.style.display = 'flex'
        updateProgress()
      }

      // 앱 실행 시 저장된 상태 불러오기
      loadState()
      initItems()
      renderCard(currentIndex)
    </script>
  </body>
</html>
