  <script>
    // 052.jpg 문제 데이터 반영[cite: 14]
    const rawQuestions = [
      {
        num: "34",
        text: "큰 고장전류가 구리 소재의 접지도체를 통하여 흐르지 않을 경우 접지도체의 최소 단면적은 몇 ㎟ 이상이어야 하는가?(단, 접지도체에 피뢰시스템이 접속되지 않는 경우이다.)",
        answer: "6",
        options: ["0.75", "2.5", "6", "16"],
        explanation: `[해설]<br><b>&lt;접지도체 단면적&gt;</b><br>
          가) 접지도체에 큰 고장전류가 흐르지 않는 경우(저압)<br>
          &nbsp;&nbsp;• 구리 : 6㎟ 이상<br>
          &nbsp;&nbsp;• 철제 : 50㎟ 이상<br><br>
          나) 접지도체에 피뢰시스템이 접속된 경우(고압)<br>
          &nbsp;&nbsp;• 구리 : 16㎟ 이상<br>
          &nbsp;&nbsp;• 철제 : 50㎟ 이상
          <hr>

<div>
  <p>
이 문제의 핵심은 '계산 없이 법으로 못 박아둔 접지도체의 최소 굵기(하한선)'를 알고 있는지, 그리고 '재질(구리 vs 철)'과 '피뢰시스템 접속 여부'라는 두 가지 함정 조건을 정확히 걸러낼 수 있는지를 묻는 것입니다. <br><br>

문장 속에 숨어 있는 출제자의 의도 3가지를 뜯어보면 문제가 훨씬 쉽게 보입니다.
  </p>
  <ul>
    <li>
<b>왜 "큰 고장전류가 흐르지 않을 경우"라고 했을까?</b>
원래 접지도체는 사고 시 흐르는 고장전류의 크기에 맞춰 굵기를 계산해 선정합니다. 하지만 고장전류가 아주 작게 흐르는 곳이라고 해서 실처럼 얇은 전선을 쓰면 땅속에서 부식되거나 외력에 쉽게 끊어질 수 있습니다. 그래서 계산값이 아무리 작게 나오더라도 기계적 강도와 부식 방지를 위해 무조건 지켜야 하는 최소 하한선을 규정한 것이 바로 이 조항(KEC 142.3.1)입니다.
    </li>

    <li>
<b>왜 "피뢰시스템이 접속되지 않는 경우"라는 단서를 달았을까?</b>
이 문제에서 가장 중요한 분기점입니다. 만약 접지도체에 피뢰시스템(피뢰침 등)이 연결되어 있다면 어마어마한 낙뢰 전류를 견뎌야 하므로 구리 기준 최소 단면적이 16 ㎟ 이상으로 껑충 뛰어오릅니다. 6 ㎟와 16 ㎟를 헷갈리게 만들려는 대표적인 출제 포인트입니다.
    </li>

    <li>
<b>왜 "구리 소재"를 꼭 짚어줬을까?</b>
구리는 전기 전도율이 높고 부식에 강해 6 ㎟만 되어도 충분하지만, 철제는 저항이 크고 녹이 잘 슬기 때문에 50 ㎟ 이상으로 훨씬 두껍게 써야 합니다.
    </li>
  </ul>
  <p>질문하신 문제는 개정 전 기출 표현("큰 고장전류가 흐르지 않을 경우")을 그대로 담고 있는데, 2026년 1월 개정된 KEC 142.3.1에서는 수험생들이 헷갈리지 않도록 기준이 더 명확해졌습니다. 앞으로 치르실 시험에서는 아래 개정 기준까지 함께 암기해 두셔야 안전합니다.</p>
  <ul>
    <li>구리 도체: 저압은 6 ㎟ 이상, 고압 이상은 16 ㎟ 이상</li>
    <li>철 도체: 50 ㎟ 이상 (전압·피뢰 여부 관계없이 동일)</li>
    <li>피뢰시스템 접속 시: 구리 16 ㎟ 이상 또는 철 50 ㎟ 이상</li>
    <li>알루미늄 도체: 부식 문제로 인해 접지도체로 사용 금지</li>
  </ul>
  <p>철제 접지도체는 전압이나 피뢰시스템 접속 여부와 상관없이 무조건 50 ㎟ 이상으로 딱 못 박아 기억해 두시면 어떤 함정 보기가 나와도 흔들리지 않습니다. 결국 구리만 6 ㎟(일반·저압)와 16 ㎟(피뢰시스템·고압 이상)로 나뉜다는 점만 구분하시면 이 유형은 완전히 정복하신 겁니다.</p>
</div>          
          `
      },
      {
        num: "35",
        text: "22.9[kV] 다중접지 특고압 가공전선로의 전로와 저압 전로를 변압기에 의하여 결합하는 경우 중성점 접지공사에 사용하는 연동 접지선 굵기는 최소 몇 [㎟] 이상인가? 단, 전로에 지락이 생겼을 때에 2초 이내에 자동적으로 이를 전로로부터 차단하는 장치가 되어있다.",
        answer: "6",
        options: ["0.75", "2.5", "6", "8"],
        explanation: `[해설]<br><b>&lt;변압기 중성점 접지도체의 '원칙(16 ㎟)'과 '예외 완화 조건(6 ㎟)&gt;</b>
          <p>변압기 중성점 접지용 접지도체(KEC 142.3.1)에서는 전로의 조건에 따라 굵기를 6 ㎟로 완화해 주는 아주 유명한 예외 조항이 따로 있습니다. 문제 문장 속에 숨겨진 단서들을 뜯어보면 출제자의 의도가 한눈에 보입니다.</p>
          <ul>
            <li><b>원칙은 16 ㎟ 이상</b>: 변압기 중성점 접지선은 고·저압 혼촉(변압기 등에서 고압 측(1차 측) 전선이나 권선이 저압 측(2차 측)과 접촉하여 두 회로가 전기적으로 연결되는 현상)이나 지락 사고 시 고장전류가 집중되는 통로이므로, 기본적으로 공칭단면적 16 ㎟ 이상의 연동선을 사용해야 합니다.</li>
            <li><b>왜 22.9 kV와 '2초 이내 차단'을 굳이 적어줬을까?</b> 우리나라 표준 배전 선로인 22.9 kV는 규정상 25 kV 이하에 해당합니다. 여기에 <b>중성선 다중접지</b>로 지락전류가 여러 군데로 분산되고, 사고 시 <b>2초 이내에 자동으로 전로를 차단</b>해 준다면 전선이 열을 받아 녹을 위험이 크게 줄어듭니다. 그래서 법으로 16 ㎟ 대신 <b>6 ㎟ 이상</b>으로 굵기를 완화해 주는 것입니다.</li>
            <li><b>고압(7 kV 이하)과 똑같은 대우:</b> 즉, 안전장치가 확실한 22.9 kV 다중접지 선로는 고압(7 kV 이하)과 동일한 수준으로 보아 6 ㎟를 허용한다고 이해하시면 암기가 훨씬 쉬워집니다.</li>
          </ul>
          <table class="exp-table">
            <tr>
              <th>구 분</th>
              <th>변압기 중성점 접지용 연동선</th>
              <th>최소 단면적</th>
            </tr>
            <tr>
              <td>원칙</td>
              <td style="text-align: left;">일반 특고압 전로 (25 kV 초과, 또는 예외 조건 미충족 시)</td>
              <td>16 ㎟ 이상</td>
            </tr>
            <tr>
              <td>예외 (완화)</td>
              <td style="text-align: left;">① 사용전압 7 kV 이하의 전로 (고압 이하)<br><br>② 사용전압 25 kV 이하 특고압 가공전선로 (다중접지 + 지락 시 2초 이내 자동차단)</td>
              <td>6 ㎟ 이상</td>
            </tr>
          </table>
          <p>시험장에서 이 유형을 만나면 숫자 <b class="text-danger">22.9 kV(25 kV 이하), 다중접지, 2초 이내 차단</b>이라는 3종 세트가 모두 들어있는지 확인하세요. 이 조건이 모두 맞물려 있으면 16 ㎟의 함정에 빠지지 않고 과감하게 6 ㎟를 고르시면 됩니다. <br><br>그럼 반대로 함정 문제를 하나 드려볼게요. 만약 문제에서 <b>사용전압이 154 kV인 특고압 전로</b>의 변압기 중성점을 접지한다면, 사용하는 연동 접지선의 최소 굵기는 몇 ㎟ 이상이어야 할까요? 16㎟ 이상</p>
          <p></p>
          `
      },
    ];

    // 셔플 함수
    function shuffleArray(array) {
      let curId = array.length;
      while (0 !== curId) {
        let randId = Math.floor(Math.random() * curId);
        curId -= 1;
        let tmp = array[curId];
        array[curId] = array[randId];
        array[randId] = tmp;
      }
      return array;
    }

    let currentScore = 0;
    let totalAnswered = 0;
    const totalQuestions = rawQuestions.length;

    // 퀴즈 초기화
    function initQuiz() {
      const container = document.getElementById("quiz-container");
      container.innerHTML = "";
      
      currentScore = 0;
      totalAnswered = 0;
      updateScore();

      // 8. 문제 순서 랜덤
      let questions = JSON.parse(JSON.stringify(rawQuestions));
      shuffleArray(questions);

      const circleNumbers = ['①', '②', '③', '④'];

      questions.forEach((q, qIndex) => {
        // 7. 예시 순서 랜덤
        shuffleArray(q.options);

        let card = document.createElement("div");
        card.className = "question-card";

        // HTML 구조 생성 (9. 업로드한 번호 사용)
        let html = `
          <div class="q-header">
            <div class="q-num">${q.num}</div>
            <div class="q-text">${q.text}</div>
          </div>
          <div class="options-container" id="opts-${qIndex}">
        `;

        q.options.forEach((opt, optIndex) => {
          let isCorrect = (opt === q.answer) ? "true" : "false";
          html += `
            <button class="option-btn" 
                    onclick="checkAnswer(this, ${qIndex}, ${isCorrect})" 
                    data-correct="${isCorrect}">
              ${circleNumbers[optIndex]} ${opt}
            </button>
          `;
        });

        html += `
          </div>
          <div id="feedback-${qIndex}" class="feedback"></div>
          
          <!-- 5. 해설 보임/안보임 버튼 -->
          <button class="btn btn-outline-secondary exp-btn" onclick="toggleExp(${qIndex})">해설 보임</button>
          <div id="exp-${qIndex}" class="explanation">${q.explanation}</div>
        `;

        card.innerHTML = html;
        container.appendChild(card);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 2, 4. 채점 및 피드백
    function checkAnswer(btn, qIndex, isCorrect) {
      const container = document.getElementById(`opts-${qIndex}`);
      const buttons = container.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);
      
      if (buttons[0].disabled) return;

      buttons.forEach(b => {
        b.disabled = true;
        // 3. 정답만 정답으로 시각적 인정
        if (b.dataset.correct === "true") {
          b.classList.add("correct");
        }
      });

      totalAnswered++;

      if (isCorrect) {
        btn.classList.add("correct");
        feedback.innerHTML = "⭕ 정답입니다!";
        feedback.className = "feedback text-correct";
        currentScore++;
      } else {
        btn.classList.add("wrong");
        feedback.innerHTML = "❌ 오답입니다!";
        feedback.className = "feedback text-wrong";
      }

      feedback.style.display = "block";
      updateScore();
    }

    // 5. 해설 토글 함수
    function toggleExp(qIndex) {
      const expDiv = document.getElementById(`exp-${qIndex}`);
      const btn = event.target;
      
      if (expDiv.style.display === "none" || expDiv.style.display === "") {
        expDiv.style.display = "block";
        btn.innerText = "해설 안보임";
        btn.classList.replace('btn-outline-secondary', 'btn-secondary');
      } else {
        expDiv.style.display = "none";
        btn.innerText = "해설 보임";
        btn.classList.replace('btn-secondary', 'btn-outline-secondary');
      }
    }

    // 점수 갱신
    function updateScore() {
      let finalScore = Math.round((currentScore / totalQuestions) * 100);
      let scoreText = (totalAnswered === 0) ? "0 / 0" : `${finalScore}점 ( ${currentScore} / ${totalQuestions} )`;
      document.getElementById("score-text").innerText = scoreText;
    }

    window.onload = initQuiz;
  </script>
</body>
</html>
